name: DNS Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    name: point DNS at running task
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-west-2
      ECS_CLUSTER: pii-redaction-cluster
      ECS_SERVICE: pii-redaction-service
      DNS_NAME: pii-redaction.bengid.dev

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Cloudflare A record with task public IP
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          # ponytail: single-task service, so tasks[0] is the whole answer.
          # If desiredCount ever goes above 1, this needs a load balancer, not a smarter query.
          TASK_ARN=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status RUNNING \
            --query "taskArns[0]" --output text)

          if [ "$TASK_ARN" = "None" ] || [ -z "$TASK_ARN" ]; then
            echo "No running task in $ECS_SERVICE"
            exit 1
          fi

          ENI_ID=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" \
            --output text)

          NEW_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids "$ENI_ID" \
            --query "NetworkInterfaces[0].Association.PublicIp" \
            --output text)

          case "$NEW_IP" in
            [0-9]*.[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Task has no public IP (got '$NEW_IP')"; exit 1 ;;
          esac

          RECORDS=$(curl -sf -X GET \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records?type=A&name=${DNS_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          COUNT=$(echo "$RECORDS" | jq '.result | length')
          if [ "$COUNT" != "1" ]; then
            echo "Expected exactly 1 A record for ${DNS_NAME}, found ${COUNT}:"
            echo "$RECORDS" | jq -r '.result[] | "  \(.id) -> \(.content)"'
            exit 1
          fi

          RECORD_ID=$(echo "$RECORDS" | jq -r '.result[0].id')
          OLD_IP=$(echo "$RECORDS" | jq -r '.result[0].content')
          PROXIED=$(echo "$RECORDS" | jq -r '.result[0].proxied')

          if [ "$OLD_IP" = "$NEW_IP" ]; then
            echo "DNS already correct: $NEW_IP"
            exit 0
          fi

          RESPONSE=$(curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${RECORD_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"type\":\"A\",\"name\":\"${DNS_NAME}\",\"content\":\"${NEW_IP}\",\"proxied\":${PROXIED}}")

          if [ "$(echo "$RESPONSE" | jq -r '.success')" != "true" ]; then
            echo "Cloudflare update failed: $RESPONSE"
            exit 1
          fi

          echo "DNS updated: $OLD_IP -> $NEW_IP"

      # ponytail: same job, so a failure in the credentials step above alerts nothing.
      # Move to a separate needs:-gated job if that blind spot ever bites.
      - name: Email on failure
        if: failure()
        env:
          SNS_TOPIC_ARN: ${{ secrets.ALERT_SNS_TOPIC_ARN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          aws sns publish \
            --topic-arn "$SNS_TOPIC_ARN" \
            --subject "DNS sync FAILED for $DNS_NAME" \
            --message "$DNS_NAME may be pointing at a dead task IP.

          Triggered by: $GITHUB_EVENT_NAME
          Logs: $RUN_URL"
