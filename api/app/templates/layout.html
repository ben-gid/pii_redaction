<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PII Redaction{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%231F6F52'/%3E%3Crect x='4' y='7' width='16' height='3.5' fill='%23FFFFFF'/%3E%3Crect x='4' y='13.5' width='10' height='3.5' fill='%23FFFFFF' fill-opacity='0.6'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/styles.css">
    {% block head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="navbar">
        <a class="brand" href="/demo">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-name">PII Redaction</span>
        </a>
        <nav class="nav-links" aria-label="Main">
            <a href="/demo" class="nav-link is-active" aria-current="page">Demo</a>
            <a href="/docs" target="_blank" rel="noopener" class="nav-link">Docs</a>
            {% if model_id %}
            <a href="https://huggingface.co/{{ model_id }}" target="_blank" rel="noopener" class="nav-link" aria-label="Model card on Hugging Face">
                <span class="nav-icon" aria-hidden="true">🤗</span><span class="nav-text">Model</span>
            </a>
            {% endif %}
            <a href="https://github.com/ben-gid/pii_redaction" target="_blank" rel="noopener" class="nav-link" aria-label="Source on GitHub">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                <span class="nav-text">GitHub</span>
            </a>
        </nav>
    </header>

    <main id="main" class="main">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
